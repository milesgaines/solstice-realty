# Fallback project definition for XcodeGen.
#
# BeMeh.xcodeproj is checked in and opens directly in Xcode 16+. This file only
# matters if that project ever needs regenerating:
#
#   brew install xcodegen && cd ios/BeMeh && xcodegen generate
#
# Set DEVELOPMENT_TEAM to your Apple Developer team ID before archiving.

name: BeMeh
options:
  bundleIdPrefix: com.bemehesthetics
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  BeMeh:
    type: application
    platform: iOS
    sources:
      - BeMeh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bemehesthetics.bemeh
        MARKETING_VERSION: "0.8"
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: BeMeh
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
